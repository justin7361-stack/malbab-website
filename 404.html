<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 — 말밥 AI</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:      #15924F;
      --primary-soft: #E8F5EE;
      --surface:      #FFFFFF;
      --bg:           #F6F8F7;
      --text-1:       #0F172A;
      --text-2:       #475569;
      --text-muted:   #94A3B8;
      --border:       #E2E8F0;
      --shadow:       0 10px 30px rgba(15,23,42,.08);
      --radius:       16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text-1); line-height: 1.65;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      max-width: 480px; width: 100%; padding: 40px 28px;
    }
    .logo { height: 34px; margin-bottom: 20px; }
    .code {
      display: inline-block; background: var(--primary-soft); color: var(--primary);
      font-size: 13px; font-weight: 700; letter-spacing: .04em;
      padding: 5px 12px; border-radius: 999px; margin-bottom: 16px;
    }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 10px; }
    p { color: var(--text-2); font-size: 15px; }
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
    .btn {
      display: block; padding: 13px 18px; border-radius: 12px;
      font-size: 15px; font-weight: 600; text-decoration: none;
      background: var(--primary); color: #fff;
    }
    .btn.ghost { background: var(--bg); color: var(--text-1); border: 1px solid var(--border); }
    .foot { margin-top: 22px; font-size: 12px; color: var(--text-muted); }
    .foot a { color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.svg" alt="말밥 AI" />
    <span class="code">404</span>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나, 링크가 잘못되었을 수 있습니다.</p>
    <div class="links">
      <a class="btn" href="https://app.malbab.com/">말밥 열기 →</a>
      <a class="btn ghost" href="/">말밥 AI 홈으로</a>
    </div>
    <p class="foot">
      <a href="/terms">이용약관</a> · <a href="/privacy">개인정보처리방침</a>
    </p>
  </main>
</body>
</html>
